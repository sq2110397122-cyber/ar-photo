<!DOCTYPE html>
<html lang="zh-CN">
  <head> <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR 动态照片</title>

    <!-- 1. 引入 3D 渲染引擎 A-Frame 与 MindAR 识别库 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      /* 点击激活声音/播放提示层 */
      #ui-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font-family: sans-serif;
        cursor: pointer;
      }
      #ui-overlay.hidden {
        display: none;
      }
      .start-btn {
        padding: 12px 24px;
        font-size: 18px;
        background: #007aff;
        color: white;
        border: none;
        border-radius: 25px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <!-- 移动端安全提示：iOS/Android 规定必须由用户手动点击一次才能播放带声音的视频 -->
    <div id="ui-overlay">
      <button class="start-btn">点击开启 AR 相机</button>
    </div>

    <!-- 2. AR 场景容器 -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- 资源预加载 -->
      <a-assets>
        <video
          id="arVideo"
          src="./video.mp4"
          preload="auto"
          loop
          crossorigin="anonymous"
          playsinline
          webkit-playsinline>
        </video>
      </a-assets>

      <!-- AR 摄像机 -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 3. 图像追踪目标 (targetIndex: 0 对应 targets.mind 中的第一张图片) -->
      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!-- 视频平面组件：width 和 height 控制视频叠加在照片上的比例 -->
        <a-video
          src="#arVideo"
          width="1"
          height="0.75"
          position="0 0 0"
          rotation="0 0 0">
        </a-video>
      </a-entity>

    </a-scene>

    <!-- 4. 逻辑控制脚本 -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const overlay = document.querySelector("#ui-overlay");
        const video = document.querySelector("#arVideo");
        const target = document.querySelector("#target");

        // 1. 用户点击启动按钮，解除 iOS/移动端的媒体播放限制
        overlay.addEventListener("click", () => {
          overlay.classList.add("hidden");
          // 预加载并静音播放一次，确保视频可随时响应
          video.play().then(() => {
            video.pause();
          }).catch(err => console.log("预加载错误:", err));
        });

        // 2. 识别到静态照片时：播放视频
        target.addEventListener("targetFound", () => {
          console.log("识别成功：找到目标照片");
          video.play();
        });

        // 3. 移开照片/丢失目标时：暂停视频
        target.addEventListener("targetLost", () => {
          console.log("识别丢失：照片离开视角");
          video.pause();
        });
      });
    </script>
  </body>
</html>
